.hero:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 60%,rgba(234,237,246,.12) 68%,rgba(234,237,246,.48) 80%,rgba(234,237,246,.86) 93%,#eaedf6 100%)}
.hero-art{position:absolute;bottom:-1px;left:0;width:100%;height:175px}.far{fill:#c3d8e4}.mid{fill:#dbe9f1}.near{fill:#f6fbfd}.sn{position:absolute;inset:0;z-index:3;pointer-events:none}.sn i{position:absolute;inset:0;background-repeat:repeat}.f1{background-image:radial-gradient(circle at 18px 26px,#fff 2.2px,transparent 3.4px),radial-gradient(circle at 70px 84px,#fffd 1.8px,transparent 3px),radial-gradient(circle at 92px 40px,#fff9 1.4px,transparent 2.4px);background-size:110px 110px;animation:s1 9s linear infinite}.f2{background-image:radial-gradient(circle at 40px 50px,#fffe 1.6px,transparent 2.6px),radial-gradient(circle at 120px 140px,#fff9 1.2px,transparent 2.2px);background-size:170px 170px;animation:s2 15s linear infinite}.f3{background-image:radial-gradient(circle at 60px 90px,#fff8 1px,transparent 1.8px),radial-gradient(circle at 170px 30px,#fff7 1px,transparent 1.8px);background-size:240px 240px;animation:s3 22s linear infinite}@keyframes s1{to{background-position:-110px 440px}}@keyframes s2{to{background-position:-170px 680px}}@keyframes s3{to{background-position:-240px 960px}}@media(prefers-reduced-motion:reduce){.sn i{animation:none}}
.topline{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 22px 0}.brand{font-weight:850;letter-spacing:.15em;font-size:11px}.pill{border:1px solid #ffffff66;background:#ffffff20;border-radius:20px;padding:7px 11px;font-size:11px;font-weight:700}
.hc{position:relative;z-index:2;padding:29px 25px 0}.eb{font-size:11px;letter-spacing:.21em;font-weight:700;color:#e8f1f4}.ht1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(35px,8.6vw,52px);font-weight:400;line-height:1.03;letter-spacing:-.035em;margin:14px 0 10px}.hs{font-size:14px;letter-spacing:.21em;font-weight:700}.hm{color:#e8f0f5;font-size:12px;margin-top:13px}
.summary{position:relative;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);margin:-24px 16px 0;background:#fff;border-radius:19px;box-shadow:var(--shadow);padding:17px 9px}.summary>div{text-align:center;border-right:1px solid var(--line)}.summary>div:last-child{border:0}.summary strong{display:block;font-size:15px;white-space:nowrap}.summary span{font-size:10px;color:var(--muted);display:block;margin-top:4px}
.kicker{font-size:10px;font-weight:850;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}.ph{margin:3px 2px 15px}.ph h2{font-size:23px;letter-spacing:-.025em;font-weight:850;margin:5px 0}.ph p{color:var(--muted);font-size:12px;margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 4px 18px #2d516207;margin-bottom:13px;overflow:hidden}.pad{padding:6px 16px}
.card>summary{display:flex;gap:12px;align-items:center;padding:15px 16px}.card>summary:after{content:"⌄";margin-left:auto;color:#8089a3;transition:.2s}.card[open]>summary:after{transform:rotate(180deg)}
.card>summary>span{font-size:20px;width:40px;height:40px;border-radius:12px;background:#e9edf8;display:grid;place-items:center}.card>summary b{display:block;font-size:15px;font-weight:850}.card>summary small{color:var(--muted);font-size:11px}

function wxDesc(code){
  code=Number(code);
  if(code===0)return ['sun','晴朗'];
  if(code===1)return ['sunCloud','晴時多雲'];
  if(code===2)return ['sunCloud','多雲時晴'];
  if(code===3)return ['cloud','多雲'];
  if(code===45||code===48)return ['mist','有霧'];
  if([51,53,55,56,57].includes(code))return ['drizzle','毛毛雨'];
  if([61,63,65,66,67,80,81,82].includes(code))return ['rain','有雨'];
  if([71,73,75,77,85,86].includes(code))return ['snow','降雪'];
  if(code>=95)return ['storm','雷雨'];
  return ['weather','天氣變化'];
}

function getWxForecast(force){
 const today=japanToday();
 if(today>'2026-12-27'||today<'2026-12-03')return;
 if(WX_INFO.loading)return;
 if(!force&&Date.now()-WX_INFO.attempted<45*60*1000)return;
 WX_INFO.loading=true;WX_INFO.error=false;WX_INFO.attempted=Date.now();
 const keys=[...new Set(WX_KEYS)];
 Promise.allSettled(keys.map(async key=>{
  const p=WX_LOCATION[key];
  const url='https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16';
  const response=await fetch(url);
  if(!response.ok)throw new Error('weather HTTP '+response.status);
  const data=await response.json(),daily=data.daily;
  if(!daily||!Array.isArray(daily.time))throw new Error('weather response missing days');
  for(let j=0;j<daily.time.length;j++){
   const max=daily.temperature_2m_max?.[j],min=daily.temperature_2m_min?.[j];
   if(Number.isFinite(max)&&Number.isFinite(min))WX_INFO.records[key+'|'+daily.time[j]]={code:daily.weather_code?.[j],max,min,rain:Number.isFinite(daily.precipitation_probability_max?.[j])?daily.precipitation_probability_max[j]:null};
  }
 })).then(results=>{WX_INFO.error=results.every(x=>x.status==='rejected');WX_INFO.updated=Date.now()}).catch(()=>{WX_INFO.error=true}).finally(()=>{WX_INFO.loading=false;render()});
}

 for(const a of (d.items||[])){
  const title=String(a.title||'');
  if(/桃園機場報到|酷航 TR892|AirAsia FD243|午餐（二選一）|大湯沼方向探索/.test(title))continue;
  if(String(d.d)==='19'&&/前往天狗山|搭 JR 返回札幌/.test(title))continue;
  if(String(d.d)==='21'&&/狸小路・薄野商圈散步/.test(title)){
    // 壽司店就在薄野附近，避免重複放入薄野，保留狸小路。
    const pp=(a.places||[])[0];if(pp)append(pp.name,pp.q);continue;
  }
  if(String(d.d)==='18'&&/Taiwan|Taoyuan/i.test(title))continue;
  for(const pp of (a.places||[])){
   if(/Taoyuan|Taiwan/i.test(String(pp.q||'')))continue;
   append(pp.name,pp.q);
  }
 }
 append(...opts.end);
 return result;
};
const googleRouteURL=points=>{
 if(points.length<2)return points[0]?SEARCH(points[0].q):'https://www.google.com/maps';
 const q=points.map(p=>encodeURIComponent(p.q));
 return 'https://www.google.com/maps/dir/?api=1&origin='+q[0]+'&destination='+q[q.length-1]+(q.length>2?'&waypoints='+q.slice(1,-1).join('%7C'):'');
};
const googleEmbedRouteURL=points=>{
 if(!points.length)return 'about:blank';
 if(points.length===1)return 'https://www.google.com/maps?q='+encodeURIComponent(points[0].q)+'&output=embed';
 const origin=encodeURIComponent(points[0].q);
 const daddr=points.slice(1).map(p=>encodeURIComponent(p.q)).join('+to:');
 return 'https://www.google.com/maps?output=embed&saddr='+origin+'&daddr='+daddr;
};

const fl=(lb,a,at,b,bt)=>'<div class="fl"><small>'+lb+'</small><div><p><b>'+at+'</b><span>'+a+'</span></p><i>'+iconSvg('planeMini')+'</i><p><b>'+bt+'</b><span>'+b+'</span></p></div></div>';

// Never replace the date-strip element when switching days: keeping the same
// element also preserves touch momentum, horizontal scroll, and keyboard focus.
let planDayScrollLeft=0;
function render(){
  const existingStrip=app.querySelector('main .days:not(.cats)');
  if(existingStrip) planDayScrollLeft=existingStrip.scrollLeft;
  if(st.tab==='plan' && existingStrip){
    const main=app.querySelector('main');
    const fragment=document.createElement('template');
    fragment.innerHTML=plan();
    const duplicateStrip=fragment.content.querySelector('.days:not(.cats)');
    if(duplicateStrip) duplicateStrip.remove();
    // Keep the original strip in the DOM: only replace the day details below it.
    Array.from(main.childNodes).forEach(node=>{if(node!==existingStrip)node.remove()});
    main.appendChild(fragment.content);
    existingStrip.querySelectorAll('[data-a="day"]').forEach(button=>{
      const selected=Number(button.dataset.v)===st.day;
      button.classList.toggle('on',selected);
      button.setAttribute('aria-pressed',String(selected));
    });
  }else{
    app.innerHTML=(st.tab==='home'?hero():'')+'<main'+(st.tab==='home'?'':' class="top"')+'>'+(st.tab==='home'?home():st.tab==='plan'?plan():todo())+'</main>';
    const newDayStrip=app.querySelector('main .days:not(.cats)');
    if(newDayStrip) newDayStrip.scrollLeft=planDayScrollLeft;
  }
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.tab));
  getWxForecast(false);
}

else if(l==='t'){const a=add?{t:'',c:'預約',done:false,url:''}:todos[n];form(add?'新增待辦':'編輯待辦',[['t','待辦事項'],['c','類別','sel',['預約','訂位','票券','其他']],['url','相關網址（選填，https://）']],a,o=>{if(!o.t)return;if(o.url&&!safeLink(o.url)){alert('網址必須以 https:// 或 http:// 開頭');return}Object.assign(a,o);if(add)todos.unshift(a);save();render()})}
else{const a=add?{t:'',done:false}:packs[n];form(add?'新增物品':'編輯物品',[['t','物品名稱']],a,o=>{if(!o.t)return;a.t=o.t;if(add)packs.push(a);ov.add('p');save();render()})}}
function move(L,i,d,l){const same=l==='t'?x=>x.done===L[i].done:()=>true;let j=i+d;while(L[j]&&!same(L[j]))j+=d;if(L[j]){const t=L[i];L[i]=L[j];L[j]=t}}

if(a==='tab'){st.tab=D.v;render();window.scrollTo(0,0)}else if(a==='day'){st.day=+D.v;SV('day',st.day);render()}else if(a==='cat'){st.cat=D.v;render()}

else if(a==='rs'){if(confirm('還原為預設內容？自訂的行程與待辦會被清除。')){days=prep();todos=T0();packs=P0();st.day=0;save();render()}}});

save();render();
