.hero:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 60%,rgba(234,237,246,.12) 68%,rgba(234,237,246,.48) 80%,rgba(234,237,246,.86) 93%,#eaedf6 100%)}
.hero-art{position:absolute;bottom:-1px;left:0;width:100%;height:175px}.far{fill:#c3d8e4}.mid{fill:#dbe9f1}.near{fill:#f6fbfd}.sn{position:absolute;inset:0;z-index:3;pointer-events:none}.sn i{position:absolute;inset:0;background-repeat:repeat}.f1{background-image:radial-gradient(circle at 18px 26px,#fff 2.2px,transparent 3.4px),radial-gradient(circle at 70px 84px,#fffd 1.8px,transparent 3px),radial-gradient(circle at 92px 40px,#fff9 1.4px,transparent 2.4px);background-size:110px 110px;animation:s1 9s linear infinite}.f2{background-image:radial-gradient(circle at 40px 50px,#fffe 1.6px,transparent 2.6px),radial-gradient(circle at 120px 140px,#fff9 1.2px,transparent 2.2px);background-size:170px 170px;animation:s2 15s linear infinite}.f3{background-image:radial-gradient(circle at 60px 90px,#fff8 1px,transparent 1.8px),radial-gradient(circle at 170px 30px,#fff7 1px,transparent 1.8px);background-size:240px 240px;animation:s3 22s linear infinite}@keyframes s1{to{background-position:-110px 440px}}@keyframes s2{to{background-position:-170px 680px}}@keyframes s3{to{background-position:-240px 960px}}@media(prefers-reduced-motion:reduce){.sn i{animation:none}}
.topline{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 22px 0}.brand{font-weight:850;letter-spacing:.15em;font-size:11px}.pill{border:1px solid #ffffff66;background:#ffffff20;border-radius:20px;padding:7px 11px;font-size:11px;font-weight:700}
.hc{position:relative;z-index:2;padding:29px 25px 0}.eb{font-size:11px;letter-spacing:.21em;font-weight:700;color:#e8f1f4}.ht1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(35px,8.6vw,52px);font-weight:400;line-height:1.03;letter-spacing:-.035em;margin:14px 0 10px}.hs{font-size:14px;letter-spacing:.21em;font-weight:700}.hm{color:#e8f0f5;font-size:12px;margin-top:13px}
.summary{position:relative;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);margin:-24px 16px 0;background:#fff;border-radius:19px;box-shadow:var(--shadow);padding:17px 9px}.summary>div{text-align:center;border-right:1px solid var(--line)}.summary>div:last-child{border:0}.summary strong{display:block;font-size:15px;white-space:nowrap}.summary span{font-size:10px;color:var(--muted);display:block;margin-top:4px}
.kicker{font-size:10px;font-weight:850;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}.ph{margin:3px 2px 15px}.ph h2{font-size:23px;letter-spacing:-.025em;font-weight:850;margin:5px 0}.ph p{color:var(--muted);font-size:12px;margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 4px 18px #2d516207;margin-bottom:13px;overflow:hidden}.pad{padding:6px 16px}
.card>summary{display:flex;gap:12px;align-items:center;padding:15px 16px}.card>summary:after{content:"⌄";margin-left:auto;color:#8089a3;transition:.2s}.card[open]>summary:after{transform:rotate(180deg)}
.card>summary>span{font-size:20px;width:40px;height:40px;border-radius:12px;background:#e9edf8;display:grid;place-items:center}.card>summary b{display:block;font-size:15px;font-weight:850}.card>summary small{color:var(--muted);font-size:11px}
.bd{padding:0 16px 16px;font-size:12px}.bd p{margin:4px 0;color:var(--muted)}

.map{display:block;background:linear-gradient(160deg,#e9edf8,#d6dcec);border:1px solid var(--line);border-radius:16px;margin:8px 0}.map svg{display:block;width:100%}.go{display:block;text-align:center;background:var(--navy);color:#fff;border-radius:12px;padding:11px;font-weight:800;font-size:13px;margin-top:8px}

.add{display:block;width:100%;border:1.5px dashed #a4afd0;background:transparent;border-radius:15px;padding:12px;color:#3f4f7a;font-weight:800;margin:14px 0}.ghost{border-color:var(--line);color:#8089a3;font-weight:500}
.days{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 15px;padding:2px 16px 6px}.days::-webkit-scrollbar{display:none}.days button{flex:none;min-width:64px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 8px;color:var(--muted)}.days b{display:block;font-size:19px;color:var(--ink);line-height:1.2}.days small{font-size:10px;font-weight:750}.days .on{background:var(--navy);border-color:var(--navy);box-shadow:0 6px 18px #2255752a}.days .on b,.days .on small{color:#fff}.cats button{min-width:0;padding:7px 15px;font-size:12.5px;font-weight:750}.cats .on{color:#fff}
.dh{position:relative;border-radius:22px;background:linear-gradient(115deg,#254d64,#6797ab);overflow:hidden;padding:19px 18px;color:#fff;box-shadow:var(--shadow)}.dh:after{content:"";position:absolute;right:-45px;bottom:-85px;border:42px solid #ffffff18;width:190px;height:190px;border-radius:50%}.dh>*{position:relative;z-index:1}.dh small{font-size:10px;background:#ffffff25;border:1px solid #ffffff55;border-radius:18px;padding:5px 10px;letter-spacing:.04em}.dh h2{font-size:24px;margin:13px 0 6px;line-height:1.3;letter-spacing:-.025em}.dh p{font-size:12px;color:#e6f0f5;margin:0 0 10px}.dh div{font-size:11px;color:#e5f2f5}
.dh.sapporo{background:linear-gradient(115deg,#254d64,#6797ab)}.dh.otaru{background:linear-gradient(115deg,#7a5878,#d3a89f)}.dh.nobori{background:linear-gradient(115deg,#2f6a58,#9bc7a6)}.dh.toya{background:linear-gradient(115deg,#1d5f8f,#80c1e3)}.dh.airport{background:linear-gradient(115deg,#3d4f7c,#a0acd3)}.soft{background:#eef1f9;border:1px solid #d9dfee;border-radius:15px;padding:11px 13px;margin:13px 0;color:#4a5880;font-size:12px}.soft summary{font-weight:800}.soft p{margin:6px 0 0}
.tlw{margin-top:17px;position:relative;padding-left:26px}.tlw:before{content:"";position:absolute;top:22px;bottom:20px;left:7px;width:2px;background:#d3d9e8}
.row{position:relative;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 4px 12px #2d516206;margin-bottom:11px}.row:before{content:"";position:absolute;left:-23px;top:17px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid #8b97c0;box-shadow:0 0 0 3px var(--pale)}
.row summary{display:flex;gap:9px;align-items:baseline;padding:11px 13px;font-size:13px;font-weight:700}.row time{color:var(--blue);font-weight:850;font-size:11px;min-width:38px;font-variant-numeric:tabular-nums}.row summary span{flex:1}
.row .bd{padding:0 13px 12px;font-size:11.5px}.c{color:#5b6a95!important}.h{color:#6a7590!important}
i.bk,i.pd{font-style:normal;font-size:10px;border-radius:6px;padding:2px 7px;font-weight:700}i.bk{background:#eaf7f0;color:#36816a}i.pd{background:#fff4e5;color:#a16936}
.row.mv{background:none;border:0;box-shadow:none;border-radius:0;margin-bottom:3px}.row.mv:before{width:6px;height:6px;left:-21px;top:10px;border:0;background:#aab2c8;box-shadow:0 0 0 3px var(--pale)}
.row.mv summary{padding:4px 2px;font-size:11px;font-weight:500;color:#6f7891}.row.mv time{font-size:10.5px;color:#8089a3;font-weight:500}.row.mv .bd{padding:0 2px 6px;font-size:10.5px}
.fn{font-size:11px;color:#8089a3;text-align:center}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,640px);height:calc(72px + var(--sb));padding:7px 4px calc(8px + var(--sb));background:#fffdfdfa;backdrop-filter:blur(18px);border-top:1px solid #dde2ef;box-shadow:0 -8px 30px #163a4e0d;z-index:100;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.bottom-nav button{border:0;background:transparent;color:#8089a3;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 1px 1px;border-radius:11px}.bottom-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bottom-nav span{font-size:10px;font-weight:750}.bottom-nav .on{color:#3f4f7a;background:#eceffa}
dialog{border:0;border-radius:20px;width:min(92vw,420px);padding:20px;color:var(--ink);box-shadow:0 20px 60px #10304a55}dialog::backdrop{background:#1a223666}dialog h3{margin:0 0 6px}dialog label{display:block;font-size:12px;color:var(--muted);margin-top:9px}dialog input,dialog textarea,dialog select{width:100%;border:1px solid #d0d7e8;border-radius:11px;padding:9px 10px;color:var(--ink);background:#f7f9fd}
.fb{display:flex;gap:10px;margin-top:15px}.fb button{flex:1;border:1px solid #d0d7e8;background:#fff;border-radius:11px;padding:10px;font-weight:800}.fb .pri{background:var(--navy);border-color:var(--navy);color:#fff}

/* 2026 北海道行程｜天氣與預約連結擴充 */
.weather-card,.weather-overview{background:linear-gradient(135deg,#fff,#f2f6fc);border:1px solid #d9e1ee;border-radius:18px;padding:15px;margin:14px 0;box-shadow:0 4px 18px rgba(48,73,108,.06)}
.weather-card{position:relative;overflow:hidden}
.weather-card:after{content:"❄";position:absolute;right:12px;top:26px;color:#dbe6f4;font-size:66px;line-height:1;pointer-events:none;z-index:0}
.weather-card>*{position:relative;z-index:1}
.wx-top,.wx-overhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.wx-kicker{font-size:11px;font-weight:850;color:#566c94;letter-spacing:.07em}
.wx-area{font-size:11px;color:#617494;background:#e9eef8;border-radius:8px;padding:4px 8px;font-weight:750}
.wx-current{display:flex;align-items:center;gap:13px;margin:9px 0 4px}
.wx-emoji{font-size:31px;line-height:1.3;flex:none}
.wx-temperatures{font-size:22px;font-weight:850;color:#243654;font-variant-numeric:tabular-nums}
.wx-subtitle{font-size:12px;font-weight:700;color:#364968}
.wx-hint{font-size:11px;line-height:1.75;color:#677691;margin:7px 0}
.wx-meta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 3px}
.wx-chip{font-size:11px;color:#4c648d;background:#e9eff9;border:1px solid #dce5f4;border-radius:9px;padding:4px 8px;font-weight:650}
.wx-source{font-size:10px;color:#8a93a8;margin-top:10px;line-height:1.55}
.wx-source a{color:#4d618c;text-decoration:underline;text-underline-offset:2px}
.wx-refresh{font-size:11px;border:1px solid #cad4e7;background:#fff;color:#4d6087;border-radius:9px;padding:6px 10px;font-weight:800}
.wx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:13px 0 9px}
.wx-day{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;text-align:left;min-height:47px;padding:9px;border:1px solid #e2e7f1;border-radius:12px;background:#fff;color:#374862;line-height:1.35}
.wx-day b{font-size:12px}.wx-day em{font-style:normal;font-size:11px;color:#61718b}.wx-day small{font-size:10px;color:#8a97a9}.wx-day .wicon{font-size:20px}
.weather-overview .wx-overhead strong{font-size:15px;color:#253753}
.wx-overview-note{font-size:11px;line-height:1.6;color:#7b87a0;margin:5px 0 0}
.td>.todo-body{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.todo-sites{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.todo-sites a{display:inline-flex;align-items:center;gap:5px;border:1px solid #cfdcf0;background:#eef3fb;border-radius:9px;padding:7px 9px;color:#475f8e;font-size:11px;font-weight:800;line-height:1.4;max-width:100%;min-height:33px}
.todo-sites a:focus-visible,.wx-day:focus-visible,.wx-refresh:focus-visible{outline:2px solid #5875b5;outline-offset:2px}
.todo-sites a:active,.wx-day:active{transform:scale(.98)}
@media(min-width:480px){.wx-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:360px){.wx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wx-day{grid-template-columns:1fr auto;gap:2px}.wx-day em{display:none}}

/* 每日行程：縮小天氣卡片，視覺重量低於頂部的行程主題色塊。總覽仍維持原尺寸。 */
.weather-card.weather-mini{border-radius:14px;padding:10px 12px;margin:10px 0 12px;box-shadow:0 3px 10px rgba(48,73,108,.045);background:linear-gradient(135deg,#fafcff,#f0f4fb)}
.weather-card.weather-mini:after{font-size:35px;right:12px;top:28px;opacity:.65}
.weather-mini .wx-kicker{font-size:10px;letter-spacing:0}
.weather-mini .wx-area{font-size:10px;padding:2px 6px;border-radius:6px}
.wx-mini-line{display:flex;align-items:center;gap:9px;margin:6px 0 0;min-height:34px}
.wx-mini-emoji{font-size:23px;line-height:1;flex:none;width:27px;text-align:center}
.wx-mini-text{min-width:0;flex:1}
.wx-mini-main{font-weight:850;font-size:13px;color:#243654;line-height:1.4}
.wx-mini-desc{font-size:10px;color:#667691;line-height:1.4;margin-top:1px}
.wx-mini-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.wx-mini-bottom .wx-source{margin:0;font-size:9px;color:#8392a6;line-height:1.35;flex:1;min-width:0}
.wx-mini-bottom .wx-refresh{flex:none;padding:4px 8px;font-size:10px;line-height:1.35;border-radius:8px}
@media(max-width:360px){.wx-mini-main{font-size:12px}.wx-mini-desc{font-size:9px}.wx-mini-bottom .wx-source{font-size:8px}}

/* 總覽線條 icon + 可折疊天氣 */
.card>summary>.sum-ic,.weather-overview>summary>.sum-ic{width:40px;height:40px;border-radius:12px;background:#e9edf8;display:grid;place-items:center;color:#536784;flex:none}
.card>summary>.sum-ic svg,.weather-overview>summary>.sum-ic svg,.wx-inline svg,.wicon svg,.wx-emoji svg,.wx-mini-emoji svg,.fl i svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wx-inline{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.18em;margin-right:4px;color:#5a7197}
.wicon,.wx-emoji,.wx-mini-emoji,.fl i{display:inline-flex;align-items:center;justify-content:center;color:#566c94}
.wx-day .wicon{width:22px;height:22px;font-size:0}
.wx-emoji{width:34px;height:34px;font-size:0}
.wx-mini-emoji{width:27px;height:27px;font-size:0}
.fl i{font-style:normal}
.weather-overview.card{padding:0;overflow:hidden}
.weather-overview>summary{display:flex;gap:12px;align-items:center;padding:15px 16px}
.weather-overview>summary:after{content:"⌄";margin-left:auto;color:#8089a3;transition:.2s}
.weather-overview[open]>summary:after{transform:rotate(180deg)}
.weather-overview .bd{padding:0 16px 16px}
.weather-overview .wx-overhead strong{display:inline-flex;align-items:center;gap:6px}
.wx-top .wx-kicker,.wx-top .wx-area{display:inline-flex;align-items:center;gap:4px}


/* 總覽：相符語意的統一線條圖示。只有總覽內生效，行程/待辦版面不變 */
.summary>div>svg{width:20px;height:20px;fill:none;stroke:#577493;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 7px}
.summary>div:nth-child(2)>svg{stroke:#7081a4}
.summary>div:nth-child(3)>svg{stroke:#667ea5}
.card>summary>.sum-ic,.weather-overview>summary>.sum-ic{background:#edf2fa;flex:none}
.card>summary>.sum-ic svg,.weather-overview>summary>.sum-ic svg{width:22px;height:22px;fill:none;stroke:#506b96;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.weather-overview>summary>.sum-ic svg{stroke:#607c9d}
.overview-address{display:flex;align-items:flex-start;gap:6px}
.overview-address svg{width:14px;height:14px;flex:none;margin-top:2px;fill:none;stroke:#7d8cab;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go{display:flex;align-items:center;justify-content:center;gap:7px}
.go svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero .brand{display:flex;align-items:center;gap:5px}.hero .brand svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 當日旅行路線：沿用總覽卡片的細線條語言，預設可折疊 */
.route-day{margin:10px 0 12px}
.route-day>summary{min-height:70px}
.route-day .bd{padding-top:0}
.route-intro{font-size:11px;line-height:1.65;color:#697792;margin:2px 0 12px!important}
.route-stops{position:relative;margin:0 4px 14px;padding:0 0 0 6px}
.route-stops:before{content:'';position:absolute;left:15px;top:17px;bottom:17px;width:1.5px;background:#d8dfec}
.route-stop{position:relative;display:flex;gap:11px;align-items:center;min-height:35px;padding:4px 0}
.route-stop b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#eef2fa;border:1px solid #d7e0ef;color:#607298;flex:none;font-size:9px;font-weight:850;z-index:1}
.route-stop:first-child b,.route-stop:last-child b{background:#5d739b;border-color:#5d739b;color:#fff}
.route-stop span{font-size:12px;font-weight:650;color:#36455f;line-height:1.5}
.route-all{font-size:12px!important;margin:12px 0 9px!important}
.route-segments{margin-top:13px;border-top:1px solid #e8edf5;padding-top:12px}
.route-small-title{font-size:11px;font-weight:800;color:#4a5d80;margin:0 0 8px}
.route-segment-links{display:grid;gap:7px}
.route-segment-links a{display:flex;align-items:center;gap:6px;border-radius:10px;border:1px solid #d9e2ef;background:#f2f5fb;padding:10px;color:#496187;font-weight:750;font-size:11px;line-height:1.55}
.route-segment-links svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.route-day .route-note{font-size:10px;color:#7a88a0;line-height:1.65;margin-top:9px}


.route-map-wrap{margin:2px 0 12px}
.route-map{position:relative;overflow:hidden;border-radius:16px;border:1px solid #d9e2ef;background:#eef3fb;height:210px;box-shadow:inset 0 1px 0 rgba(255,255,255,.65)}
.route-map iframe{width:100%;height:100%;border:0;display:block}
.route-map-tip{font-size:10px;color:#7a88a0;line-height:1.55;margin:7px 2px 0}
.route-map-fallback{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:#617390;padding:18px;text-align:center}
.route-segment-maps{display:grid;gap:10px;margin-top:12px}
.route-seg-map{border:1px solid #d9e2ef;border-radius:14px;background:#f6f8fc;padding:10px}
.route-seg-map b{display:block;font-size:11px;color:#4a5d80;margin-bottom:8px}
.route-seg-map .route-map{height:170px;border-radius:12px}


/* 每日地圖：極簡霧藍灰，保留真正地圖與 Google Maps 轉跳 */
.route-day{margin:10px 0 13px;background:#fff;border-color:#dbe2ee;box-shadow:0 3px 16px rgba(41,62,94,.045)}
.route-day>summary{min-height:68px;padding:14px 16px}
.route-day>summary .sum-ic{background:#eaf0f9;color:#557092}
.route-day>.bd{padding:0 14px 14px}
.route-map-shell{margin:0 0 12px;border:1px solid #dde5ef;border-radius:15px;background:#f4f7fb;overflow:hidden}
.route-map-bar{height:38px;display:flex;justify-content:space-between;align-items:center;gap:9px;padding:0 12px;background:#f1f5fa;border-bottom:1px solid #e0e7f1}
.route-map-bar-date{display:flex;align-items:center;gap:8px;color:#4c5d79;font-size:11px;font-weight:800;letter-spacing:.02em}
.route-map-bar-date i{width:7px;height:7px;border-radius:50%;background:#7993b4;box-shadow:0 0 0 3px #e0e9f5}
.route-map-bar-tag{color:#8a98ad;font-size:9px;font-weight:750;letter-spacing:.12em}
.route-map{height:232px;border:0;border-radius:0;box-shadow:none;background:#edf2f8}
.route-map iframe{width:100%;height:100%;display:block;border:0;filter:saturate(.62) contrast(.96) brightness(1.03)}
.route-map-caption{display:flex;align-items:center;gap:7px;min-height:37px;padding:8px 12px;color:#7c899c;font-size:10px;line-height:1.45;background:#f6f8fc}
.route-map-caption svg{width:14px;height:14px;flex:none;fill:none;stroke:#778da9;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.route-day .route-all{display:flex;align-items:center;justify-content:center;gap:8px;background:#546c90;color:#fff;border:1px solid #546c90;border-radius:11px;padding:12px 10px;margin:0;font-size:12px;font-weight:780;box-shadow:none}
.route-day .route-all svg{width:16px;height:16px;flex:none}
.route-day .route-all svg:last-child{width:14px;height:14px;opacity:.72}
.route-day .route-note{color:#8a94a5;font-size:10px;line-height:1.6;margin:9px 3px 0}
.route-segment-fold{margin-top:9px;border:1px solid #e4e9f2;border-radius:11px;background:#f8fafc;overflow:hidden}
.route-segment-fold>summary{display:flex;gap:8px;align-items:center;padding:10px 12px;color:#566b88;font-size:11px;font-weight:750}
.route-segment-fold>summary:after{content:'⌄';margin-left:auto;color:#93a1b5}
.route-segment-fold[open]>summary:after{transform:rotate(180deg)}
.route-segment-fold>summary svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.route-segment-fold .route-segment-links{display:grid;gap:6px;padding:0 10px 10px}
.route-segment-fold .route-segment-links a{border:1px solid #e0e7f1;background:#fff;border-radius:9px;padding:9px 10px;font-weight:650;color:#5d7090}
@media(max-width:360px){.route-map{height:205px}.route-map-bar-tag{display:none}}

/* 購物清單：與冬日旅誌一致的霧藍紫／奶白簡約 UI */
.sh-heading{margin:5px 1px 15px}
.sh-heading .kicker{display:flex;align-items:center;gap:8px}

.sh-group-title{font-weight:850;font-size:13px;white-space:normal;overflow-wrap:anywhere}
.sh-count{font-size:10px;color:#8b97ac;font-weight:750;margin-left:4px}

.sh-list{padding:0 12px 3px}

/* 北海道冬日旅誌｜輕薄 Liquid Glass：滑動選取鏡片 */
main{padding-bottom:calc(108px + var(--sb))}
.bottom-nav{
  position:fixed;
  left:50%;right:auto;
  bottom:calc(9px + var(--sb));
  transform:translateX(-50%);
  width:calc(100% - 26px);
  max-width:598px;
  height:62px;
  padding:4px;
  z-index:100;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  align-items:stretch;
  gap:0;
  overflow:hidden;
  isolation:isolate;
  border:1px solid rgba(255,255,255,.83);
  outline:1px solid rgba(80,98,132,.13);
  outline-offset:0;
  border-radius:999px;
  background:linear-gradient(165deg,rgba(255,255,255,.34) 0%,rgba(245,248,255,.14) 55%,rgba(255,255,255,.26) 100%);
  -webkit-backdrop-filter:blur(23px) saturate(165%) brightness(1.055);
  backdrop-filter:blur(23px) saturate(165%) brightness(1.055);
  box-shadow:0 6px 24px rgba(42,60,99,.12),0 1px 3px rgba(56,69,101,.05),inset 0 1.5px 0 rgba(255,255,255,.9),inset 0 -1px 1px rgba(103,124,158,.12);
}
.bottom-nav::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.31),transparent 32%,rgba(205,217,238,.035) 79%,rgba(255,255,255,.17));
}
/* 唯一的選取膠囊移動，而不是四個按鈕個別切換背景。 */
.nav-glass-indicator{
  position:absolute;
  top:4px;bottom:4px;
  left:0;
  width:25%;
  z-index:1;
  pointer-events:none;
  border-radius:999px;
  transform:translate3d(5px,0,0);
  will-change:transform;
  transition:transform 510ms cubic-bezier(.20,1.20,.34,1),width 280ms cubic-bezier(.20,.9,.32,1);
}
.nav-glass-indicator.nav-no-motion{transition:none!important}
.nav-lens-core{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:inherit;
  border:1px solid rgba(255,255,255,.78);
  background:linear-gradient(148deg,rgba(255,255,255,.44),rgba(195,204,226,.30) 53%,rgba(239,243,253,.26));
  -webkit-backdrop-filter:blur(12px) saturate(180%);
  backdrop-filter:blur(12px) saturate(180%);
  box-shadow:0 2px 9px rgba(78,95,136,.12),inset 0 1px 3px rgba(255,255,255,.9),inset 0 -1.5px 3px rgba(107,124,154,.12);
}
.nav-lens-core::before{
  content:"";
  position:absolute;
  inset:1px;
  pointer-events:none;
  border-radius:inherit;
  background:radial-gradient(ellipse at 22% 0%,rgba(255,255,255,.71),transparent 53%),radial-gradient(ellipse at 95% 100%,rgba(184,199,227,.20),transparent 48%);
}
.nav-lens-core::after{
  content:"";
  position:absolute;
  inset:-8% -45%;
  background:linear-gradient(104deg,transparent 32%,rgba(255,255,255,.75) 47%,rgba(255,255,255,.08) 54%,transparent 69%);
  transform:translateX(-95%);
  opacity:0;
  pointer-events:none;
}
.nav-glass-indicator.nav-moving .nav-lens-core{animation:navLensElastic 510ms cubic-bezier(.2,.8,.2,1)}
.nav-glass-indicator.nav-moving .nav-lens-core::after{animation:navLensGlint 540ms ease-out}
@keyframes navLensElastic{
  0%{transform:scaleX(.97) scaleY(1)}
  35%{transform:scaleX(1.115) scaleY(.96)}
  75%{transform:scaleX(.987) scaleY(1.01)}
  100%{transform:scale(1)}
}
@keyframes navLensGlint{
  0%{opacity:0;transform:translateX(-95%)}
  20%{opacity:.92}
  72%{opacity:.64}
  100%{opacity:0;transform:translateX(97%)}
}
.bottom-nav button{
  position:relative;
  z-index:2;
  min-width:0;
  min-height:0;
  border:1px solid transparent;
  border-radius:999px;
  background:transparent;
  box-shadow:none;
  color:#606d87;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:5px 1px 3px;
  text-shadow:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:color 210ms ease,transform 180ms ease;
}
.bottom-nav button svg{
  width:20px;
  height:20px;
  flex:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  fill:none;
}
.bottom-nav button span{
  font-size:9.5px;
  font-weight:650;
  line-height:1.2;
  letter-spacing:.015em;
  white-space:nowrap;
}
.bottom-nav button.on{
  color:#34445e;
  border-color:transparent;
  background:transparent;
  box-shadow:none;
}
.bottom-nav button.on::after{content:none}
.bottom-nav button:active{transform:scale(.94)}
.bottom-nav button:focus-visible{outline:2px solid #7888ad;outline-offset:-4px}
@media(max-width:370px){
  .bottom-nav{width:calc(100% - 18px);height:59px;padding:4px}
  .bottom-nav button{gap:2px}
  .bottom-nav button svg{width:19px;height:19px}
  .bottom-nav button span{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
  .nav-glass-indicator{transition:none!important}
  .nav-glass-indicator.nav-moving .nav-lens-core,
  .nav-glass-indicator.nav-moving .nav-lens-core::after{animation:none!important}
  .bottom-nav button{transition:none!important}
}


/* iPhone Safari：輸入時避免因表單字體小於 16px 而自動放大畫面。
   保留使用者手動雙指縮放，不使用 maximum-scale/user-scalable=no。 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
textarea,select{font-size:16px!important}
/* Liquid Glass：去掉底部選單的外部投影，保留透明、模糊及反光。 */
.bottom-nav{box-shadow:none!important}
.nav-lens-core{box-shadow:inset 0 1px 2px rgba(255,255,255,.78)!important}


/* 購物圖片：完整置中顯示、點擊放大 */
.sh-image,.sh-photo-preview{place-items:center;text-align:center}
.sh-image img,.sh-photo-preview img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;display:block;margin:auto}
.sh-image-open,.sh-photo-preview:not(:disabled){cursor:zoom-in}
.sh-image-open{appearance:none;padding:4px;touch-action:manipulation;line-height:0}
.sh-image-open:focus-visible,.sh-photo-preview:focus-visible{outline:2px solid #7088b0;outline-offset:2px}
.sh-photo-preview{appearance:none;padding:6px}
.sh-photo-preview:disabled{cursor:default;opacity:1}
dialog.sh-lightbox{position:fixed;inset:0;margin:0;padding:30px 15px;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;background:transparent;box-shadow:none;overflow:hidden;z-index:2000}

dialog.sh-lightbox::backdrop{background:rgba(24,34,54,.79);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sh-lightbox img{display:block;max-width:min(92vw,900px);max-height:calc(100dvh - 105px);width:auto;height:auto;object-fit:contain;object-position:center;border-radius:12px;box-shadow:0 8px 35px rgba(15,30,55,.24)}

 .sh-form{padding:20px 15px calc(19px + env(safe-area-inset-bottom,0px))}
 .sh-form label:not(.sh-photo-upload){margin-top:15px}
}


/* 圖片以固定框尺寸顯示，避免直式照片撐高商品卡片 */
.sh-image{position:relative}
.sh-image img,.sh-image.sh-image-open img{
  position:absolute;inset:0;width:100%;height:100%;
  max-width:100%;max-height:100%;object-fit:cover;object-position:center;
}


/* 北海道冬日旅誌｜點擊回饋與表單焦點，取自封面霧藍灰調 */
:root{--mist-focus:#a7b4c6;--mist-focus-border:#a3b2c5;--mist-focus-halo:rgba(152,170,193,.18)}
/* iOS Safari 的黑色點擊高亮與 summary 預設焦點框 */
summary,details>summary,[data-a],button,a,label[for],.sh-image-open{
  -webkit-tap-highlight-color:transparent;
}
summary:focus,details>summary:focus{outline:none!important}
/* 僅鍵盤導覽保留低彩度、柔和但清晰的焦點提示 */
summary:focus-visible,details>summary:focus-visible{
  outline:none!important;
  box-shadow:inset 0 0 0 2px rgba(136,156,182,.43);
  border-radius:inherit;
}
/* 避免點擊折疊時框線閃爍；底色微變取代黑色框線 */
.card>summary,.row>summary,.soft>summary,.weather-overview>summary{
  -webkit-tap-highlight-color:transparent;
  transition:background-color .2s ease;
}
.card>summary:active,.row>summary:active,.soft>summary:active,
.weather-overview>summary:active{background-color:rgba(214,225,238,.23)}
/* 輸入焦點：霧藍灰邊框與淡薄光暈，避免高飽和藍色 */
dialog input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):focus,
dialog textarea:focus,dialog select:focus,
.sh-form input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):focus,
.sh-form textarea:focus,
.sh-form select:focus{
  outline:none!important;
  border-color:var(--mist-focus-border)!important;
  box-shadow:0 0 0 3px var(--mist-focus-halo)!important;
  background-color:#fcfdff!important;
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;
}
input::selection,textarea::selection{background:#dbe4ee;color:#29384d}


/* 2026-11 總覽四張卡片：與天氣卡一致的薄霧藍漸層 */
.overview-panel{
  background:linear-gradient(132deg,#fff 0%,#f6f9fd 47%,#edf3fa 100%);
  border:1px solid #d9e1ee;border-radius:18px;
  box-shadow:0 4px 18px rgba(48,73,108,.06);
}
.overview-panel>summary{
  background:linear-gradient(102deg,rgba(255,255,255,.38),rgba(234,242,251,.27));
}
.overview-panel>summary>.sum-ic{
  background:linear-gradient(142deg,#f6f9ff,#e8eef8);
  border:1px solid rgba(204,216,233,.55);
}
.overview-panel .ht,.overview-panel .rs{border-color:#dde5f1}
.overview-panel .lk a{background:rgba(244,247,252,.83)}

/* 航班資訊：左右時刻水平對齊，中央飛機固定置中 */
.flight-card{
  padding:13px 14px 14px;
  margin-top:11px;border-radius:15px;
  background:linear-gradient(130deg,rgba(255,255,255,.88),rgba(234,241,250,.68));
  border:1px solid rgba(211,221,236,.88);
}
.flight-meta{display:flex;align-items:center;gap:7px 9px;flex-wrap:wrap;line-height:1.4}
.flight-tag{
  display:inline-flex;align-items:center;justify-content:center;
  background:#e8eef7;color:#5d6f8c;border-radius:7px;
  padding:3px 7px;font-size:10px;font-weight:760;
}
.flight-date{font-size:11px;color:#61728c;font-weight:700}
.flight-airline{font-size:11px;color:#7887a0;font-weight:650;white-space:normal}
.flight-route{
  display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);
  align-items:center;gap:5px;margin-top:12px;
}
.flight-point{min-width:0;text-align:left}
.flight-point strong{
  display:block;font-size:23px;line-height:1.25;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;font-weight:800;color:#2d3b52;
}
.flight-point span{
  display:block;margin-top:5px;font-size:10.5px;line-height:1.45;
  font-weight:600;color:#76839b;overflow-wrap:anywhere;
}
.flight-point.flight-end{text-align:right}
.flight-center{
  width:54px;display:flex;align-items:center;justify-content:center;gap:4px;
  align-self:center;position:relative;padding-top:0;
}
.flight-center .flight-line{
  height:1px;background:#b6c4d9;min-width:6px;flex:1;
}
.flight-center i{
  width:22px;height:22px;display:grid;place-items:center;
  color:#6f83a2;flex:none;font-style:normal;
}
.flight-center i svg{width:17px;height:17px;display:block;transform:rotate(90deg)}
@media(max-width:360px){
  .flight-card{padding:12px 10px}
  .flight-route{grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);gap:4px}
  .flight-center{width:46px}
  .flight-point strong{font-size:21px}
  .flight-point span{font-size:10px}
}

/* 工具按鈕：淡灰黑按壓回饋，避免強烈的系統外框 */
.tl button,.sh-mini-actions button{
  -webkit-tap-highlight-color:transparent;
  outline:none;
  transition:background-color .16s ease,border-color .16s ease,
             color .16s ease,box-shadow .16s ease;
}
.tl button:hover,.sh-mini-actions button:hover{
  background:#f4f6f9;border-color:#bac3ce;color:#435065;
}
.tl button:active,.sh-mini-actions button:active{
  background:#e5e8ed;border-color:#9aa2ad;
  color:#374252;box-shadow:inset 0 0 0 .5px rgba(54,61,70,.22);
}
.tl button:focus-visible,.sh-mini-actions button:focus-visible{
  outline:none!important;border-color:#9aa2ad;
  background:#eef1f5;
  box-shadow:0 0 0 2px rgba(67,76,89,.12)!important;
}
@media(prefers-reduced-motion:reduce){
  .tl button,.sh-mini-actions button{transition:none}
}


/* 介面微互動：輕觸編輯、刪除、上／下移時，在按鈕內浮現片刻淡灰黑色。 */
.tl button,.sh-mini-actions button{
  position:relative;
  -webkit-tap-highlight-color:transparent;
  border-radius:9px;
  outline:none;
  transition:background-color .15s ease,color .15s ease,border-color .15s ease,transform .15s ease;
}
.tl button:active,.sh-mini-actions button:active{
  background:rgba(40,46,56,.085)!important;
  border-color:rgba(73,81,91,.22)!important;
  color:#374152!important;
  transform:scale(.97);
  box-shadow:inset 0 0 0 1px rgba(40,45,54,.04)!important;
}
.tl button:focus:not(:focus-visible),.sh-mini-actions button:focus:not(:focus-visible){outline:none;box-shadow:none}
.tl button:focus-visible,.sh-mini-actions button:focus-visible{
  outline:2px solid rgba(72,83,99,.32)!important;
  outline-offset:2px;
  box-shadow:0 0 0 2px rgba(76,89,111,.065)!important;
}
/* 閃一下的淡灰黑觸感，即使按下後清單立即重新渲染，也能看見。 */
.tool-tap-flash{
  position:fixed;z-index:350;pointer-events:none;box-sizing:border-box;
  border:1px solid rgba(47,55,68,.12);
  background:rgba(35,42,53,.095);
  box-shadow:inset 0 0 0 .5px rgba(35,42,53,.08);
  animation:toolTapFlash .24s ease-out both;
  transform-origin:center center;
}
@keyframes toolTapFlash{
  0%{opacity:0;transform:scale(.985)}
  16%{opacity:1;transform:scale(.975)}
  42%{opacity:1;transform:scale(.985)}
  100%{opacity:0;transform:scale(1)}
}
@media(prefers-reduced-motion:reduce){
  .tool-tap-flash{animation:toolTapFade .15s linear both}
  @keyframes toolTapFade{0%,40%{opacity:1}100%{opacity:0}}
  .tl button,.sh-mini-actions button{transition:none}
}


/* 購物清單縮圖｜固定 70 × 70 px，原圖維持等比置中裁切，點擊可完整放大 */
.sh-product{grid-template-columns:23px 70px minmax(0,1fr)}
.sh-product .sh-image,
.sh-product .sh-image.sh-image-open{
  position:relative;
  box-sizing:border-box;
  width:70px;
  height:70px;
  min-width:70px;
  min-height:70px;
  max-width:70px;
  max-height:70px;
  aspect-ratio:1/1;
  padding:0;
  display:grid;
  place-items:center;
  align-self:start;
  border-radius:12px;
  overflow:hidden;
}
.sh-product .sh-image img,
.sh-product .sh-image.sh-image-open img{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  object-fit:cover;
  object-position:50% 50%;
  margin:0;
}
@media(max-width:360px){
  .sh-product{grid-template-columns:20px 70px minmax(0,1fr)}
}


/* 航班時長：區分當地起降時間與實際飛行時間 */
.flight-extra{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;margin-top:10px}
.flight-duration{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid #dae4f0;border-radius:8px;background:linear-gradient(120deg,#f7faff,#edf3fa);color:#516985;font-size:11px;font-weight:760;letter-spacing:.012em}
.flight-localnote{font-size:10px;letter-spacing:.01em;color:#919db0}
.flight-duration{white-space:nowrap}
.flight-route{margin-top:10px}
/* 寺田壽司：套餐細節清晰分層、與總覽霧藍灰漸層一致 */
.meal-info{margin-top:10px;padding:11px 12px 12px;border:1px solid #dde5f0;border-radius:12px;background:linear-gradient(130deg,rgba(255,255,255,.92),rgba(236,242,250,.68))}
.meal-heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px!important;color:#35465f;font-size:12px;font-weight:800;line-height:1.5}
.meal-heading span{font-size:10px;font-weight:700;color:#65758b;padding:1px 6px;border-radius:5px;background:#e8edf5}
.meal-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.meal-meta span{border:1px solid #e0e6ef;border-radius:7px;padding:4px 7px;color:#576e8a;background:rgba(255,255,255,.62);font-weight:700;font-size:10px}
.meal-courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;padding:9px 0 0;margin:0;list-style:none;border-top:1px solid #e2e8f1}
.meal-courses li{display:flex;align-items:center;gap:6px;min-width:0;color:#5c6e86;font-size:11px;font-weight:620;line-height:1.55}
.meal-courses li:before{content:'';display:inline-block;width:4px;height:4px;flex:0 0 4px;border-radius:50%;background:#9eafc6}


/* 總覽航班 2.0：垂直時序、時間與機場一眼可讀的旅行票卡 */
.overview-f .bd{padding:0 14px 16px}
.fl.flight-ticket{
 margin-top:11px;
 padding:0;
 overflow:hidden;
 border-radius:16px;
 border:1px solid rgba(203,216,235,.9);
 background:linear-gradient(122deg,rgba(255,255,255,.95),rgba(239,245,252,.88));
 box-shadow:0 4px 15px rgba(38,57,88,.035);
}
.fl.flight-ticket > .flight-ticket-head{
 display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;
 padding:12px 13px 10px;border-bottom:1px solid rgba(212,224,238,.76);
 background:linear-gradient(110deg,rgba(223,234,248,.42),rgba(253,254,255,.42));
}
.fl.flight-ticket .flight-tag{
 display:inline-flex;align-items:center;justify-content:center;
 min-width:36px;padding:3px 7px;border-radius:7px;
 color:#4c6284;font-size:10px;font-weight:800;
 background:rgba(215,226,241,.72);
}
.fl.flight-ticket .flight-date{font-size:11px;letter-spacing:.01em;color:#536683;font-weight:750}
.fl.flight-ticket .flight-number{
 margin-left:auto;color:#354765;font-size:12px;
 font-weight:850;letter-spacing:.04em;font-variant-numeric:tabular-nums;
}
.fl.flight-ticket > .flight-ticket-body{display:block;margin:0;padding:13px 13px 12px}
.fl.flight-ticket .flight-stop{
 display:grid;grid-template-columns:13px 67px minmax(0,1fr);
 align-items:center;gap:9px;min-height:43px;margin:0;
}
.fl.flight-ticket .flight-dot{
 display:block;width:9px;height:9px;justify-self:center;
 border:2px solid #8295b2;border-radius:50%;background:#fff;
 box-shadow:0 0 0 3px rgba(211,224,240,.38);
}
.fl.flight-ticket .flight-stop.arrive .flight-dot{background:#879bb9;border-color:#879bb9}
.fl.flight-ticket .flight-time{
 display:block;color:#293950;font-weight:850;font-size:17px;
 letter-spacing:-.035em;font-variant-numeric:tabular-nums;
}
.fl.flight-ticket .flight-location{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.35}
.fl.flight-ticket .flight-location strong{
 display:block;font-size:14px;letter-spacing:.02em;color:#2c3c56;line-height:1.35;
}
.fl.flight-ticket .flight-location span{
 display:block;font-size:10.5px;line-height:1.5;color:#8290a8;
 overflow-wrap:anywhere;
}
.fl.flight-ticket .flight-journey{
 position:relative;display:grid;grid-template-columns:13px 67px minmax(0,1fr);
 align-items:center;gap:9px;min-height:39px;
}
.fl.flight-ticket .flight-timeline-stroke{
 height:100%;width:1px;justify-self:center;
 background:repeating-linear-gradient(to bottom,#b6c6dd 0,#b6c6dd 5px,transparent 5px,transparent 9px);
}
.fl.flight-ticket .flight-journey-icon{
 display:flex;align-items:center;justify-content:center;
 justify-self:start;width:27px;height:27px;
 border-radius:50%;border:1px solid rgba(194,211,231,.75);
 color:#748aaa;background:rgba(237,243,252,.84);
}
.fl.flight-ticket .flight-journey-icon svg{width:14px;height:14px;display:block;transform:rotate(90deg)}
.fl.flight-ticket .flight-journey-text{
 display:block;color:#607591;font-size:10.5px;font-weight:750;letter-spacing:.02em;
}
.fl.flight-ticket > .flight-ticket-footer{
 display:flex;align-items:center;justify-content:space-between;
 gap:5px 12px;flex-wrap:wrap;margin:0;
 padding:9px 13px 10px;border-top:1px solid rgba(214,225,239,.8);
 background:rgba(248,250,254,.55);
}
.fl.flight-ticket .flight-ticket-footer span{font-size:10.5px;font-weight:750;color:#596f8d}
.fl.flight-ticket .flight-ticket-footer small{font-size:9.5px;font-weight:500;color:#929fb1}
@media(max-width:365px){
 .overview-f .bd{padding-left:11px;padding-right:11px}
 .fl.flight-ticket > .flight-ticket-body{padding:12px 10px}
 .fl.flight-ticket .flight-stop,.fl.flight-ticket .flight-journey{grid-template-columns:11px 59px minmax(0,1fr);gap:7px}
 .fl.flight-ticket .flight-time{font-size:16px}
 .fl.flight-ticket .flight-location strong{font-size:13px}
 .fl.flight-ticket .flight-location span{font-size:10px}
}


/* 航班資訊｜依照參考圖重排，保留北海道旅誌的柔霧藍灰視覺 */
.overview-f .bd{padding-top:3px}
.flight-board{
  margin-top:9px;overflow:hidden;border-radius:19px;
  background:linear-gradient(145deg,rgba(255,255,255,.91),rgba(249,251,255,.9) 57%,rgba(239,245,253,.83));
  border:1px solid rgba(208,219,235,.86);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.84);
}
.flight-leg{padding:18px 17px 22px}
.flight-leg+.flight-leg{border-top:1px solid #e2e8f1;padding-top:23px}
.flight-leg-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:19px}
.flight-leg-id{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap;line-height:1.3}
.flight-leg-date{font-size:14px;font-weight:790;letter-spacing:-.025em;color:#33445d;white-space:nowrap}
.flight-leg-direction{font-size:14px;font-weight:800;color:#33445d;white-space:nowrap}
.flight-leg-separator{font-size:14px;color:#a6b5c8;padding:0 1px}
.flight-leg-number{font-size:15px;font-weight:800;color:#263853;letter-spacing:.01em;white-space:nowrap}
.flight-leg-airline{
  flex:none;font-size:11px;font-weight:750;line-height:1.45;
  color:#71849d;white-space:nowrap;text-align:right;
}
.flight-leg-route{
  display:grid;grid-template-columns:minmax(0,1fr) 94px minmax(0,1fr);
  align-items:start;gap:5px;
}
.flight-node{min-width:0}
.flight-node.arrive{text-align:right}
.flight-clock{display:block;font-size:24px;line-height:1.11;font-weight:825;letter-spacing:-.045em;color:#243550;font-variant-numeric:tabular-nums}
.flight-airport{display:flex;align-items:baseline;gap:4px;margin-top:12px;flex-wrap:wrap;line-height:1.4}
.flight-node.arrive .flight-airport{justify-content:flex-end}
.flight-airport strong{font-size:12px;font-weight:800;color:#586b89;white-space:nowrap}
.flight-airport span{font-size:11px;font-weight:580;color:#8794a9;white-space:nowrap}

.flight-mid-symbol{width:76px;height:25px;display:flex;align-items:center;justify-content:center;gap:8px;color:#6f82a0}

@media(max-width:375px){

  .flight-leg-top{margin-bottom:17px}

  .flight-leg-airline{font-size:10px}

  .flight-clock{font-size:22px}

  .flight-airport strong{font-size:11px}
  .flight-airport span{font-size:10px}
  .flight-mid-symbol{width:68px}
  .flight-mid-symbol svg{width:19px;height:19px}
  .flight-mid-duration{font-size:10px}
  .flight-board-note{padding:0 12px 16px}
}

/* 購物頁與待辦頁同一套版面語言：標題、分類籤、清單、行動按鈕 */
.sh-heading.ph{margin:3px 2px 15px}
.sh-heading.ph .kicker{display:block;align-items:initial;gap:0}
.sh-heading.ph h2{font-size:23px;line-height:inherit;font-weight:850;letter-spacing:-.025em;margin:5px 0}
.sh-heading.ph p{font-size:12px;color:var(--muted);line-height:inherit}
.sh-filters.days.cats{display:flex;grid-template-columns:none;gap:9px;overflow-x:auto;margin:0 -16px 15px;padding:2px 16px 6px}
.sh-filters.days.cats button{flex:none;min-height:auto;min-width:0;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--muted);font-size:12.5px;font-weight:750;padding:7px 15px;white-space:nowrap;box-shadow:none}
.sh-filters.days.cats button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 18px #2255752a}
.sh-filters.days.cats small{font-size:10px;font-weight:750;margin-left:3px;opacity:.9;color:inherit}
/* 待辦清單的白色卡片、細分隔線和行距 */
.sh-flat.card.pad{padding:6px 16px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 4px 18px #2d516207;overflow:hidden;margin-bottom:13px}
.sh-flat .sh-product{grid-template-columns:22px 70px minmax(0,1fr);gap:10px;min-height:0;border-top:1px solid var(--line);padding:12px 0;align-items:start}
.sh-flat .sh-product:first-child{border-top:0}
.sh-flat .sh-tick{width:18px;height:18px;accent-color:var(--blue);margin:24px 0 0 0}
/* 保留 70×70 圖片框與點擊放大能力 */
.sh-flat .sh-image,.sh-flat .sh-image.sh-image-open{height:70px;width:70px;min-height:70px;min-width:70px;border-radius:12px;flex:none;border-color:var(--line);background:#f1f3fa}
.sh-flat .sh-product-name{font-size:13px;line-height:1.55;font-weight:800;color:var(--ink)}
.sh-flat .sh-product.done .sh-product-name{color:#8089a3}

function wxDesc(code){
  code=Number(code);
  if(code===0)return ['sun','晴朗'];
  if(code===1)return ['sunCloud','晴時多雲'];
  if(code===2)return ['sunCloud','多雲時晴'];
  if(code===3)return ['cloud','多雲'];
  if(code===45||code===48)return ['mist','有霧'];
  if([51,53,55,56,57].includes(code))return ['drizzle','毛毛雨'];
  if([61,63,65,66,67,80,81,82].includes(code))return ['rain','有雨'];
  if([71,73,75,77,85,86].includes(code))return ['snow','降雪'];
  if(code>=95)return ['storm','雷雨'];
  return ['weather','天氣變化'];
}

function getWxForecast(force){
 const today=japanToday();
 if(today>'2026-12-27'||today<'2026-12-03')return;
 if(WX_INFO.loading)return;
 if(!force&&Date.now()-WX_INFO.attempted<45*60*1000)return;
 WX_INFO.loading=true;WX_INFO.error=false;WX_INFO.attempted=Date.now();
 const keys=[...new Set(WX_KEYS)];
 Promise.allSettled(keys.map(async key=>{
  const p=WX_LOCATION[key];
  const url='https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16';
  const response=await fetch(url);
  if(!response.ok)throw new Error('weather HTTP '+response.status);
  const data=await response.json(),daily=data.daily;
  if(!daily||!Array.isArray(daily.time))throw new Error('weather response missing days');
  for(let j=0;j<daily.time.length;j++){
   const max=daily.temperature_2m_max?.[j],min=daily.temperature_2m_min?.[j];
   if(Number.isFinite(max)&&Number.isFinite(min))WX_INFO.records[key+'|'+daily.time[j]]={code:daily.weather_code?.[j],max,min,rain:Number.isFinite(daily.precipitation_probability_max?.[j])?daily.precipitation_probability_max[j]:null};
  }
 })).then(results=>{WX_INFO.error=results.every(x=>x.status==='rejected');WX_INFO.updated=Date.now()}).catch(()=>{WX_INFO.error=true}).finally(()=>{WX_INFO.loading=false;render()});
}

const normalizeBookingName=raw=>String(raw||'').toLowerCase().replace(/2026|20\d\d|12\/\d{1,2}|\d{1,2}:\d\d/g,'').replace(/預約|訂位|待確認|待訂|預訂|已訂|確認|票券|購票|門票|安排|完成|參觀|體驗|前往|預定/g,'').replace(/[\s\u3000\p{P}\p{S}]/gu,'');
function bookingStatus(a){
 if(a.bookingKey){
  const matching=todos.filter(t=>taskKeys(t).includes(a.bookingKey));
  if(matching.length){const done=matching.some(t=>t.done);return {booked:done,pending:!done};}
 }
 // 自訂待辦「預約／訂位」也能連動同名行程；短名稱不自動比對，避免誤判。
 if(a.pending){
  const key=normalizeBookingName(a.title);
  if(key.length>=4){
   const similar=todos.filter(t=>['預約','訂位'].includes(t.c)&&(()=>{const v=normalizeBookingName(t.t);return v.length>=4&&(v.includes(key)||key.includes(v));})());
   if(similar.length){const done=similar.some(t=>t.done);return {booked:!!a.booked||done,pending:!done&&!a.booked};}
  }
 }

}

 for(let i=0;i<draft.length;i++){
  const item=draft[i];
  if(!String(item[required]||'').trim()){
   overviewActive[k]=i;ov.add(k);render();
   alert(k==='i'?'請填寫資訊名稱':'請填寫名稱');
   app.querySelector('.overview-inline-editor [name="'+required+'"]')?.focus();return false;
  }
  if(k==='i'){
   if(item.url&&!safeLink(item.url)){
    overviewActive[k]=i;ov.add(k);render();alert('請輸入完整網址，須以 https:// 或 http:// 開頭。');app.querySelector('.overview-inline-editor [name="url"]')?.focus();return false;
   }
   item.url=item.url?safeLink(item.url):'';
  }else{
   const map=validOverviewMap(item.mapUrl);
   if(map===null){
    overviewActive[k]=i;ov.add(k);render();alert('請輸入有效的 Google Maps 連結（例如 maps.app.goo.gl）。');
    app.querySelector('.overview-inline-editor [name="mapUrl"]')?.focus();return false;
   }
   item.mapUrl=map;item.mapSelection=true;
  }
 }
 if(k==='h')overviewHotels=draft;else if(k==='r')overviewRestaurants=draft;else overviewInfos=draft;
 persistOverview(k);overviewDraft[k]=null;overviewActive[k]=null;overviewMode[k]='view';ov.add(k);render();return true;
}
function overviewCancelEdit(k){
 overviewDraft[k]=null;overviewActive[k]=null;overviewMode[k]='view';ov.add(k);render();
}
function overviewActions(k){
 const mode=overviewMode[k];
 const noun=k==='h'?'住宿':k==='r'?'餐廳':'資訊';
 return '<div class="overview-actions"><button type="button" class="overview-glass-plus" data-a="ov-add" data-k="'+k+'" aria-label="新增'+noun+'" title="新增'+noun+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" class="overview-mini '+(mode==='edit'?'selected':'')+'" data-a="ov-mode" data-k="'+k+'" data-v="'+(mode==='edit'?'save':'edit')+'">'+(mode==='edit'?'確認更改':'編輯')+'</button><button type="button" class="overview-mini '+(mode==='delete'?'selected':'')+'" data-a="ov-mode" data-k="'+k+'" data-v="'+(mode==='delete'?'view':'delete')+'">'+(mode==='delete'?'完成':'刪除')+'</button></div>';
}
function overviewRow(k,item,i){
 const editing=overviewMode[k]==='edit'&&overviewActive[k]===i;
 const showMinus=overviewMode[k]==='delete';
 const kind=k==='h'?'ht':k==='r'?'rs':'info-record';
 if(editing)return '<div class="'+kind+' overview-record is-editing" data-ov-row="'+k+'" data-i="'+i+'">'+overviewEditor(k,item)+'</div>';
 if(k==='i'){
  const name=overviewEsc(item.title),note=overviewEsc(item.note),href=safeLink(item.url||'');
  const copy='<span class="info-link-icon">'+iconSvg('externalLink')+'</span><span class="info-link-copy"><strong>'+name+'</strong><small>'+note+'</small></span><span class="info-link-arr">↗</span>';
  const link=overviewMode[k]==='edit'?'<button type="button" class="info-link info-edit-tap" data-a="ov-open" data-k="'+k+'" data-i="'+i+'" aria-label="編輯 '+name+'">'+copy+'<span class="info-edit-hint">點選修改</span></button>':href&&overviewMode[k]==='view'?'<a class="info-link" href="'+overviewEsc(href)+'" target="_blank" rel="noopener noreferrer">'+copy+'</a>':'<div class="info-link info-no-link">'+copy+'</div>';
  return '<div class="info-record overview-record" data-ov-row="i" data-i="'+i+'">'+(showMinus?'<button type="button" class="overview-minus" data-a="ov-remove" data-k="i" data-i="'+i+'" aria-label="刪除 '+name+'">−</button>':'')+'<div class="overview-record-body">'+link+'</div></div>';
 }
 const text='<small>'+overviewEsc(item.date)+(k==='h'&&item.nights?'・'+overviewEsc(item.nights):'')+'</small><b>'+overviewEsc(item.name)+'</b>'+(k==='h'&&item.addr?'<p class="overview-address">'+iconSvg('pin')+overviewEsc(item.addr)+'</p>':'')+(item.detail?'<p>'+overviewEsc(item.detail).replace(/\n/g,'<br>')+'</p>':'')+(k==='r'?overviewMeal(item):'');
 const action='<button type="button" class="overview-record-tap" data-a="ov-open" data-k="'+k+'" data-i="'+i+'" aria-label="編輯 '+overviewEsc(item.name)+'">'+text+'<span class="overview-tap-hint">點一下修改</span></button>';
 return '<div class="'+kind+' overview-record" data-ov-row="'+k+'" data-i="'+i+'">'+(showMinus?'<button type="button" class="overview-minus" data-a="ov-remove" data-k="'+k+'" data-i="'+i+'" aria-label="刪除 '+overviewEsc(item.name)+'">−</button>':'')+'<div class="overview-record-body">'+(overviewMode[k]==='edit'?action:text)+(overviewMode[k]==='view'?overviewMapLink(item):'')+'</div></div>';
}
function overviewPanel(k){
 const mode=overviewMode[k],list=mode==='edit'&&overviewDraft[k]?overviewDraft[k]:overviewList(k);
 const content=list.map((item,i)=>overviewRow(k,item,i)).join('');
 return overviewActions(k)+(mode==='edit'?'<p class="overview-help">點選項目後直接修改，可連續修改多項；最後按右上角「確認更改」統一儲存。</p>':mode==='delete'?'<p class="overview-help">點選每項左側的「−」圓框即可刪除；按「完成」結束。</p>':'')+(list.length?content:'<p class="overview-help">目前沒有資料，點右上角「＋」新增。</p>');
}

const spotGuideFor=a=>{

  return SPOT_GUIDES.find(g=>g.match.test(title))||null;
};
const spotCard=a=>{
  const g=spotGuideFor(a); if(!g) return '';
  // When a remote picture is unavailable, use a small built-in scenic illustration instead of a broken-image icon.
  const photo=g.img||g.fallback;
  const backup=g.img?'<img class="spot-backup" alt="'+esc(g.name)+' 景點示意圖" src="'+esc(g.fallback)+'" loading="lazy">':'';
  const pic='<img class="spot-main" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="'+esc(photo)+'" alt="'+esc(g.name)+' 景點圖片" onerror="this.style.display=&quot;none&quot;;this.parentNode.classList.add(&quot;spot-photo-failed&quot;);">';
  return '<div class="spot"><div class="spot-ph">'+backup+pic+'</div><div class="spot-tx"><small>景點介紹</small><b>'+esc(g.name)+'</b><p>'+esc(g.intro)+'</p></div></div>';
};

const row=(a,i)=>{const mv=a.kind==='交通',status=bookingStatus(a),desc=bookedText(a,status);
const title=status.booked&&a.bookingKey==='snow'?a.title.replace('（待訂）',''):a.title;
const cost=status.booked&&a.bookingKey==='snow'?String(a.cost||'').replace('尚未預訂','依已訂方案'):a.cost;
const bd=[desc&&'<p>'+esc(desc)+'</p>',cost&&'<p class="c">💴 '+esc(cost)+'</p>',a.hours&&'<p class="h">🕘 '+esc(a.hours)+'</p>',spotCard(a),links(a.places)].filter(Boolean).join('');
return '<details class="row'+(mv?' mv':'')+'" data-k="'+a.id+'"'+(ov.has(a.id)?' open':'')+'><summary><time>'+esc(a.time)+'</time><span>'+(mv?'↳ ':'')+esc(title)+'</span>'+(status.booked?'<i class="bk">已訂</i>':status.pending?'<i class="pd">待確認</i>':'')+'</summary><div class="bd">'+bd+'<div class="tl">'+tool('d',i)+'</div></div></details>'};

  '27':{start:['千歲市區（暫定）','Chitose City Hokkaido Japan'],end:['新千歲機場國際線','New Chitose Airport International Terminal']}
};
const dayRouteStops=d=>{
 const opts=DAY_ROUTE_ENDPOINTS[String(d.d)];
 if(!opts)return [];
 const result=[];
 const append=(label,q)=>{
  if(!q)return;
  if(result.length && result[result.length-1].q===q)return;
  result.push({label:String(label||q),q:String(q)});
 };
 append(...opts.start);
 for(const a of (d.items||[])){
  const title=String(a.title||'');
  if(/桃園機場報到|酷航 TR892|AirAsia FD243|午餐（二選一）|大湯沼方向探索/.test(title))continue;
  if(String(d.d)==='19'&&/前往天狗山|搭 JR 返回札幌/.test(title))continue;
  if(String(d.d)==='21'&&/狸小路・薄野商圈散步/.test(title)){
    // 壽司店就在薄野附近，避免重複放入薄野，保留狸小路。
    const pp=(a.places||[])[0];if(pp)append(pp.name,pp.q);continue;
  }
  if(String(d.d)==='18'&&/Taiwan|Taoyuan/i.test(title))continue;
  for(const pp of (a.places||[])){
   if(/Taoyuan|Taiwan/i.test(String(pp.q||'')))continue;
   append(pp.name,pp.q);
  }
 }
 append(...opts.end);
 return result;
};
const googleRouteURL=points=>{
 if(points.length<2)return points[0]?SEARCH(points[0].q):'https://www.google.com/maps';
 const q=points.map(p=>encodeURIComponent(p.q));
 return 'https://www.google.com/maps/dir/?api=1&origin='+q[0]+'&destination='+q[q.length-1]+(q.length>2?'&waypoints='+q.slice(1,-1).join('%7C'):'');
};
const googleEmbedRouteURL=points=>{
 if(!points.length)return 'about:blank';
 if(points.length===1)return 'https://www.google.com/maps?q='+encodeURIComponent(points[0].q)+'&output=embed';
 const origin=encodeURIComponent(points[0].q);
 const daddr=points.slice(1).map(p=>encodeURIComponent(p.q)).join('+to:');
 return 'https://www.google.com/maps?output=embed&saddr='+origin+'&daddr='+daddr;
};

async function shopReadPhoto(file){
 if(!file)return;
 if(!file.type.startsWith('image/')&&!/\.(heic|heif|jpg|jpeg|png|webp|gif)$/i.test(file.name)){alert('請選擇圖片檔案');return}
 if(file.size>40*1024*1024){alert('圖片過大，請選擇 40 MB 以下的照片');return}
 const objUrl=URL.createObjectURL(file),photo=new Image();
 try{
   await new Promise((resolve,reject)=>{photo.onload=resolve;photo.onerror=reject;photo.src=objUrl});
   const scale=Math.min(1,900/Math.max(photo.naturalWidth,photo.naturalHeight));
   const w=Math.max(1,Math.round(photo.naturalWidth*scale)),h=Math.max(1,Math.round(photo.naturalHeight*scale));
   const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('canvas');
   ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(photo,0,0,w,h);
   shopPhotoTemp=canvas.toDataURL('image/jpeg',0.76);
   shopPreviewUpdate();
 }catch(e){alert('這張圖片無法讀取，請試試 JPG 或 PNG 格式。')}
 finally{URL.revokeObjectURL(objUrl)}
}

function syncNavGlass(force=false){
  const nav=document.querySelector('.bottom-nav');
  if(!nav)return;
  const lens=nav.querySelector('.nav-glass-indicator');
  const button=nav.querySelector('button.on');
  if(!lens||!button)return;
  const tab=button.dataset.v;
  const first=navGlassLastTab===null;
  const changed=navGlassLastTab!==tab;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const instant=first||force||reduce;
  if(instant)lens.classList.add('nav-no-motion');
  lens.style.width=button.offsetWidth+'px';
  lens.style.transform='translate3d('+button.offsetLeft+'px,0,0)';
  if(changed&&!instant){
    window.clearTimeout(navGlassTimer);
    lens.classList.remove('nav-moving');
    void lens.offsetWidth; // re-trigger glint when switching rapidly between tabs
    lens.classList.add('nav-moving');
    navGlassTimer=window.setTimeout(()=>lens.classList.remove('nav-moving'),550);
  }
  navGlassLastTab=tab;
  if(instant)window.requestAnimationFrame(()=>window.requestAnimationFrame(()=>lens.classList.remove('nav-no-motion')));
}
window.addEventListener('resize',()=>syncNavGlass(true));
function render(){
  const existingStrip=app.querySelector('main .days:not(.cats)');
  if(existingStrip) planDayScrollLeft=existingStrip.scrollLeft;
  if(st.tab==='plan' && existingStrip){
    const main=app.querySelector('main');
    const fragment=document.createElement('template');
    fragment.innerHTML=plan();
    const duplicateStrip=fragment.content.querySelector('.days:not(.cats)');
    if(duplicateStrip) duplicateStrip.remove();
    // Keep the original strip in the DOM: only replace the day details below it.
    Array.from(main.childNodes).forEach(node=>{if(node!==existingStrip)node.remove()});
    main.appendChild(fragment.content);
    existingStrip.querySelectorAll('[data-a="day"]').forEach(button=>{
      const selected=Number(button.dataset.v)===st.day;
      button.classList.toggle('on',selected);
      button.setAttribute('aria-pressed',String(selected));
    });
  }else{
    app.innerHTML=(st.tab==='home'?hero():'')+'<main'+(st.tab==='home'?'':' class="top"')+'>'+(st.tab==='home'?home():st.tab==='plan'?plan():st.tab==='todo'?todo():shopPage())+'</main>';
    const newDayStrip=app.querySelector('main .days:not(.cats)');
    if(newDayStrip) newDayStrip.scrollLeft=planDayScrollLeft;
  }
  document.querySelectorAll('.bottom-nav button').forEach(b=>{const active=b.dataset.v===st.tab;b.classList.toggle('on',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  syncNavGlass();
  getWxForecast(false);
}
function form(title,fs,v,cb){dlg.innerHTML='<form><h3>'+title+'</h3>'+fs.map(f=>'<label>'+f[1]+(f[2]==='area'?'<textarea name="'+f[0]+'" rows="3">'+esc(v[f[0]])+'</textarea>':f[2]==='sel'?'<select name="'+f[0]+'">'+f[3].map(o=>'<option'+(o===v[f[0]]?' selected':'')+'>'+o+'</option>').join('')+'</select>':'<input name="'+f[0]+'" value="'+esc(v[f[0]])+'">')+'</label>').join('')+'<div class="fb"><button type="button" data-a="cx">取消</button><button class="pri">儲存</button></div></form>';dlg.querySelector('form').onsubmit=e=>{e.preventDefault();const o={};new FormData(e.target).forEach((x,k)=>o[k]=String(x).trim());dlg.close();cb(o)};dlg.showModal()}
function edit(l,n){const add=n<0;
if(l==='d'){const L=days[st.day].items,a=add?{id:uid(),time:'',title:'',desc:'',cost:'',hours:'',kind:'觀光',places:[]}:L[n];form(add?'新增行程':'編輯行程',[['time','開始時間（例 09:30）'],['title','行程名稱'],['desc','行程細節','area'],['cost','費用說明'],['hours','營業時間']],a,o=>{if(!o.title)return;Object.assign(a,o);if(add){a.bookingKey=matchBookingKey(days[st.day],a);L.push(a)};ov.add(a.id);save();render()})}
else if(l==='t'){const a=add?{t:'',c:'預約',done:false,url:''}:todos[n];form(add?'新增待辦':'編輯待辦',[['t','待辦事項'],['c','類別','sel',['預約','訂位','票券','其他']],['url','相關網址（選填，https://）']],a,o=>{if(!o.t)return;if(o.url&&!safeLink(o.url)){alert('網址必須以 https:// 或 http:// 開頭');return}Object.assign(a,o);if(a.bookingKey&&!BOOKING_RULES.some(r=>r.key===a.bookingKey&&r.todo.test(a.t)))delete a.bookingKey;if(add)todos.unshift(a);save();render()})}
else{const a=add?{t:'',done:false}:packs[n];form(add?'新增物品':'編輯物品',[['t','物品名稱']],a,o=>{if(!o.t)return;a.t=o.t;if(add)packs.push(a);ov.add('p');save();render()})}}
function move(L,i,d,l){const same=l==='t'?x=>x.done===L[i].done:()=>true;let j=i+d;while(L[j]&&!same(L[j]))j+=d;if(L[j]){const t=L[i];L[i]=L[j];L[j]=t}}
// 按鈕觸感以獨立暫時圖層呈現：點擊若立即開啟編輯視窗或移動項目，回饋也不會消失。
const TAP_ACTIONS=new Set(['ed','rm','mv','shop-edit','shop-delete']);
function tapToolFlash(btn){
 if(!btn||!TAP_ACTIONS.has(btn.dataset.a))return;
 const rect=btn.getBoundingClientRect();
 if(rect.width<1||rect.height<1)return;
 const flash=document.createElement('span');
 flash.className='tool-tap-flash';flash.setAttribute('aria-hidden','true');
 const radius=getComputedStyle(btn).borderRadius||'9px';
 Object.assign(flash.style,{
   left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',borderRadius:radius
 });
 document.body.appendChild(flash);
 flash.addEventListener('animationend',()=>flash.remove(),{once:true});
 window.setTimeout(()=>flash.remove(),350);
}
document.addEventListener('pointerdown',e=>{
 if(e.button!==0&&e.pointerType==='mouse')return;
 tapToolFlash(e.target.closest('button[data-a]'));
},{passive:true});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&!e.repeat){
   const active=document.activeElement;
   if(active&&active.matches('button[data-a]'))tapToolFlash(active);
 }
});
document.addEventListener('submit',e=>{
 const f=e.target;if(!f.matches('.overview-inline-editor'))return;
 e.preventDefault();overviewSave(f.dataset.ovForm);
},true);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const D=b.dataset,a=D.a,n=+D.i,L=D.l==='d'?days[st.day].items:D.l==='t'?todos:packs;
if(a==='ov-add'){
  const k=D.k;if(!['h','r','i'].includes(k))return;
  overviewStartEdit(k);overviewCapture(k);
  const arr=overviewDraft[k];arr.push({id:uid(),...(k==='i'?{title:'',note:'',url:''}:{name:'',date:'',mapUrl:''})});
  overviewActive[k]=arr.length-1;ov.add(k);render();
  app.querySelector('.overview-record.is-editing [name="'+overviewRequiredName(k)+'"]')?.focus();
}else if(a==='ov-mode'){
  const k=D.k;if(!['h','r','i'].includes(k))return;
  if(D.v==='save')overviewSave(k);
  else if(D.v==='edit'){
    overviewStartEdit(k);overviewActive[k]=null;ov.add(k);render();
  }else if(D.v==='delete'){
    overviewDraft[k]=null;overviewMode[k]='delete';overviewActive[k]=null;ov.add(k);render();
  }else if(D.v==='view')overviewCancelEdit(k);
}else if(a==='ov-open'){
  const k=D.k;if(overviewMode[k]==='edit'){
    overviewCapture(k);overviewActive[k]=Number(D.i);ov.add(k);render();
    app.querySelector('.overview-record.is-editing [name="'+overviewRequiredName(k)+'"]')?.focus();
  }
}else if(a==='ov-cancel'){
  const k=D.k,idx=overviewActive[k];
  if(overviewMode[k]==='edit'&&overviewDraft[k]&&idx!==null){
    if(overviewDraft[k][idx]&&!overviewList(k).some(x=>x.id===overviewDraft[k][idx].id))overviewDraft[k].splice(idx,1);
    else if(overviewList(k)[idx])overviewDraft[k][idx]={...overviewList(k)[idx]};
  }
  overviewActive[k]=null;ov.add(k);render();
}else if(a==='ov-remove'){
  const k=D.k,list=overviewList(k),idx=Number(D.i),item=list[idx];
  if(overviewMode[k]==='delete'&&item&&confirm('確定刪除「'+(item.name||item.title)+'」嗎？')){
    list.splice(idx,1);persistOverview(k);ov.add(k);render();
  }
}else if(a==='tab'){st.tab=D.v;render();window.scrollTo(0,0)}else if(a==='day'){st.day=+D.v;SV('day',st.day);render()}else if(a==='cat'){st.cat=D.v;render()}
else if(a==='mv'){move(L,n,+D.d,D.l);save();render()}else if(a==='rm'){if(confirm('確定刪除？')){L.splice(n,1);save();render()}}
else if(a==='weather-day'){st.day=+D.i;SV('day',st.day);st.tab='plan';render();window.scrollTo(0,0)}else if(a==='weather-refresh'){WX_INFO.attempted=0;getWxForecast(true);render()}
else if(a==='shop-add')shopEditor(null)
else if(a==='shop-edit')shopEditor(D.id)
else if(a==='shop-zoom'){const p=shopping.find(x=>x.id===D.id);if(p)shopShowImage(p.image,p.name)}
else if(a==='shop-zoom-preview'){if(shopPhotoTemp)shopShowImage(shopPhotoTemp,dlg.querySelector('[name="name"]')?.value||'商品')}
else if(a==='shop-zoom-close'){const popup=document.getElementById('sh-lightbox');if(popup?.open)popup.close()}
else if(a==='shop-delete'){const p=shopping.find(x=>x.id===D.id);if(p&&confirm('確定刪除「'+p.name+'」嗎？')){const previous=shopping.slice();shopping=shopping.filter(x=>x.id!==D.id);if(shopPersist(previous))render()}}
else if(a==='shop-qty-edit'){const input=dlg.querySelector('input[name="qty"]');if(input){const value=Math.floor(Number(input.value)||1);input.value=Math.max(1,Math.min(9999,value+Number(D.change)))}}
else if(a==='shop-check'){const p=shopping.find(x=>x.id===D.id);if(p){p.done=!p.done;if(shopPersist())render();else p.done=!p.done}}
else if(a==='shop-mode'){shopMode=D.v;render()}
else if(a==='shop-hint'){if(D.field==='store'){const f=dlg.querySelector('[name="store"]');if(f){f.value=D.value;f.focus()}}}
else if(a==='shop-photo-remove'){shopPhotoTemp='';const f=dlg.querySelector('#sh-photo-file');if(f)f.value='';shopPreviewUpdate()}
else if(a==='shop-cancel'){dlg.close();dlg.classList.remove('sh-dialog');shopPhotoTemp=''}
else if(a==='tg'){L[n].done=!L[n].done;save();render()}else if(a==='ed')edit(D.l,n);else if(a==='add')edit(D.l,-1);else if(a==='cx')dlg.close();
else if(a==='rs'){if(confirm('還原為預設內容？自訂的行程與待辦會被清除。')){days=prep();todos=T0();packs=P0();st.day=0;save();render()}}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset?.a==='shop-photo'&&t.files?.[0])shopReadPhoto(t.files[0]);
});
document.addEventListener('toggle',e=>{
 const k=e.target.dataset&&e.target.dataset.k;
 if(k){e.target.open?ov.add(k):ov.delete(k)}
},true);
save();render();
})();
</script></body></html>
